plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${mod_group}"
base {
    archivesName = "${mod_named}"
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(java_version.toInteger())
}

java {
    withSourcesJar()
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = "${neoversion}"
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        configureEach {
            systemProperty 'fml.earlyprogresswindow', 'false'
        }

        client {
            client()
            gameDirectory = file('run')
            def world = findProperty('vm_world') ?: 'extra_test'
            if (file("run/saves/${world}").isDirectory()) {
                programArguments.addAll '--quickPlaySingleplayer', world.toString()
            }
        }

        server {
            server()
            gameDirectory = file('run')
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', modid
        }

        serverData {
            serverData()
            gameDirectory = file('run')
            systemProperty 'extrabotany.datagen.handwritten', file('src/main/resources').absolutePath
            def datagenOutput = findProperty('datagen_output') ? file(findProperty('datagen_output')) : file('src/generated/resources')
            programArguments.addAll '--mod', "${modid}", '--all',
                    '--output', datagenOutput.getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }

        clientData {
            clientData()
            gameDirectory = file('run')
            systemProperty 'extrabotany.datagen.handwritten', file('src/main/resources').absolutePath
            def datagenOutput = findProperty('datagen_output') ? file(findProperty('datagen_output')) : file('src/generated/resources')
            programArguments.addAll '--mod', "${modid}", '--all',
                    '--output', datagenOutput.getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
            if (!project.hasProperty('no_gametest')) {
                sourceSet(sourceSets.gametest)
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

repositories {
    mavenCentral()
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'vazkii.patchouli'
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Curse Maven'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    implementation "curse.maven:${botania_curse_id}:${botania_file_id}"

    implementation "vazkii.patchouli:patchouli-neoforge:${patchouli_version}"

    compileOnly "maven.modrinth:curios:${curios_version}"
    runtimeOnly "maven.modrinth:curios:${curios_version}"

    compileOnly "mezz.jei:jei-${mcversion}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mcversion}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${mcversion}-neoforge:${jei_version}"

    compileOnly "maven.modrinth:kubejs:${kubejs_version}"
    compileOnly "maven.modrinth:rhino:${rhino_version}"

    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.demonwav.mcdev:annotations:2.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": mod_named,
                "Specification-Vendor": "ExtraMeteorP / Lounode",
                "Specification-Version": "1",
                "Implementation-Title": mod_named,
                "Implementation-Version": "${version}",
                "Implementation-Vendor": "${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { rename { "${it}-${modid}" } }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            mod_id                       : modid,
            mod_name                     : mod_name,
            mod_authors                  : author,
            mod_version                  : mod_version,
            mod_license                  : license,
            mod_description              : project.description,
            mod_logo                     : mod_logo,
            mod_credits                  : mod_credits,
            minecraft_version_range      : minecraft_version_range,
            neoforge_version_range       : neoversion_range,
            loader_version_range         : loader_version,
            botania_version_range        : botania_version_range,
            patchouli_version_range      : patchouli_version_range,
            curios_version_range         : curios_version_range,
            jei_version_range            : jei_version_range,
            kubejs_version_range         : kubejs_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '100000'])
}

tasks.register('printCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    def gcp = sourceSets.gametest.compileClasspath
    doLast {
        file('build/cp.txt').text = cp.files.join(File.pathSeparator)
        file('build/cp_gametest.txt').text = gcp.files.join(File.pathSeparator)
    }
}
