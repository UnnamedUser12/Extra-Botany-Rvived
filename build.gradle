plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = "${mcversion}-${mod_version}-${tag_lanzador}"
group = "${mod_group}"
base {
    archivesName = "${mod_named}"
}

// Minecraft 1.21.1 needs Java 21
java.toolchain {
    vendor = JvmVendorSpec.ADOPTIUM
    languageVersion = JavaLanguageVersion.of(java_version.toInteger())
}

java {
    withSourcesJar()
}

sourceSets {
    // Game tests and their structures. They are not part of the release jar.
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = "${neoversion}"
    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
            gameDirectory = file('run')
            // Abre directo el mundo de pruebas: ./gradlew runClient -Pvm_world=<carpeta en run/saves>
            def world = findProperty('vm_world') ?: 'extra_test'
            if (file("run/saves/${world}").isDirectory()) {
                programArguments.addAll '--quickPlaySingleplayer', world.toString()
            }
        }

        server {
            server()
            gameDirectory = file('run')
            programArgument '--nogui'
        }

        // ./gradlew runGameTestServer : runs the tests of src/gametest (never part of the release jar)
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', modid
        }

        data {
            data()
            gameDirectory = file('run')
            // Hand-written resources win over generated ones (see datagen/util/HandWrittenFilter).
            systemProperty 'extrabotany.datagen.handwritten', file('src/main/resources').absolutePath
            // -Pdatagen_output=<dir> sends the output somewhere else, to compare it before replacing src/generated/resources.
            def datagenOutput = findProperty('datagen_output') ? file(findProperty('datagen_output')) : file('src/generated/resources')
            programArguments.addAll '--mod', "${modid}", '--all',
                    '--output', datagenOutput.getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath(),
                    '--existing-mod', 'botania'
        }
    }

    mods {
        "${modid}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache'
}

repositories {
    mavenCentral()
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'C4'
        url = 'https://maven.theillusivec4.top/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'LatvianDev'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
        }
    }
    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Botania Revived (modid botania, package velrondevs.botania)
    implementation "curse.maven:${botania_curse_id}:${botania_file_id}"

    // Patchouli
    implementation "vazkii.patchouli:Patchouli:${patchouli_version}"

    // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    // JEI (optional)
    compileOnly "mezz.jei:jei-${mcversion}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mcversion}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${mcversion}-neoforge:${jei_version}"

    // EMI (optional)
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"

    // KubeJS (optional)
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"

    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly 'com.demonwav.mcdev:annotations:2.1.0'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

test {
    enabled = false
}

jar {
    manifest {
        attributes([
                "Specification-Title": mod_named,
                "Specification-Vendor": "ExtraMeteorP / Lounode",
                "Specification-Version": "1",
                "Implementation-Title": mod_named,
                "Implementation-Version": "${version}",
                "Implementation-Vendor": "${author}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Includes the license file in the built mod
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { rename { "${it}-${modid}" } }
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            mod_id                       : modid,
            mod_name                     : mod_name,
            mod_authors                  : author,
            mod_version                  : mod_version,
            mod_license                  : license,
            mod_description              : project.description,
            mod_logo                     : mod_logo,
            mod_credits                  : mod_credits,
            minecraft_version_range      : minecraft_version_range,
            neoforge_version_range       : neoversion_range,
            loader_version_range         : loader_version,
            botania_version_range        : botania_version_range,
            patchouli_version_range      : patchouli_version_range,
            curios_version_range         : curios_version_range,
            kubejs_version_range         : kubejs_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.addAll(['-Xmaxerrs', '2000'])
}
